<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#0a0a0a" stroke="#d4a017" stroke-width="1.5"/>
  
  <!-- IC chip body -->
  <rect x="9" y="9" width="14" height="14" rx="2" fill="none" stroke="#d4a017" stroke-width="1.5"/>
  
  <!-- Chip pins - left -->
  <line x1="5" y1="12" x2="9" y2="12" stroke="#d4a017" stroke-width="1.2"/>
  <line x1="5" y1="16" x2="9" y2="16" stroke="#d4a017" stroke-width="1.2"/>
  <line x1="5" y1="20" x2="9" y2="20" stroke="#d4a017" stroke-width="1.2"/>
  
  <!-- Chip pins - right -->
  <line x1="23" y1="12" x2="27" y2="12" stroke="#d4a017" stroke-width="1.2"/>
  <line x1="23" y1="16" x2="27" y2="16" stroke="#d4a017" stroke-width="1.2"/>
  <line x1="23" y1="20" x2="27" y2="20" stroke="#d4a017" stroke-width="1.2"/>
  
  <!-- Chip pins - top -->
  <line x1="13" y1="5" x2="13" y2="9" stroke="#d4a017" stroke-width="1.2"/>
  <line x1="16" y1="5" x2="16" y2="9" stroke="#d4a017" stroke-width="1.2"/>
  <line x1="19" y1="5" x2="19" y2="9" stroke="#d4a017" stroke-width="1.2"/>
  
  <!-- Chip pins - bottom -->
  <line x1="13" y1="23" x2="13" y2="27" stroke="#d4a017" stroke-width="1.2"/>
  <line x1="16" y1="23" x2="16" y2="27" stroke="#d4a017" stroke-width="1.2"/>
  <line x1="19" y1="23" x2="19" y2="27" stroke="#d4a017" stroke-width="1.2"/>
  
  <!-- Pin 1 dot -->
  <circle cx="11.5" cy="11.5" r="1" fill="#d4a017"/>
  
  <!-- Center label -->
  <text x="16" y="17.5" text-anchor="middle" font-family="monospace" font-size="5" font-weight="bold" fill="#d4a017">HW</text>
</svg>
